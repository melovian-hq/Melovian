# Go lint for first-party packages. Vendor and generated Android Wails tree are skipped.
version: "2"

run:
  timeout: 5m
  modules-download-mode: vendor
  build-tags:
    - server

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - frontend
      - build/android/wails-v3
      - build/tools
      - scripts/showcase/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor
      - frontend
      - build/android/wails-v3
      - build/tools
      - scripts/showcase/node_modules
