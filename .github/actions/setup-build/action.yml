name: Setup build environment
description: Install toolchain, Wails CLI, and platform build dependencies

inputs:
  install-linux-deps:
    description: Install Linux GTK/WebKit/libmpv packages
    required: false
    default: "false"
  install-nsis:
    description: Install NSIS on Windows for installer packaging
    required: false
    default: "false"
  install-macos-deps:
    description: Install macOS packaging tools such as librsvg
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup development environment
      uses: ./.github/actions/setup-dev
      with:
        install-wails: "true"

    - name: Install Linux build dependencies
      if: inputs.install-linux-deps == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev \
          libmpv-dev \
          pkg-config \
          gcc \
          libc6-dev \
          imagemagick

    - name: Install NSIS
      if: inputs.install-nsis == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install nsis -y --no-progress
        $nsisPath = "C:\Program Files (x86)\NSIS"
        $env:PATH = "$nsisPath;$env:PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $nsisPath

    - name: Install macOS build dependencies
      if: inputs.install-macos-deps == 'true'
      shell: bash
      run: |
        set -euo pipefail
        brew install librsvg imagemagick

    - name: Install Windows image dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install imagemagick -y --no-progress
