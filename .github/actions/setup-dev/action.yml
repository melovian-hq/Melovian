name: Setup development environment
description: Checkout repository and install Go, Node, pnpm, and Task

inputs:
  go-cache:
    description: Enable Go module cache
    required: false
    default: "true"
  install-frontend:
    description: Install frontend dependencies with pnpm
    required: false
    default: "true"
  install-wails:
    description: Install the Wails v3 CLI for bindings generation
    required: false
    default: "false"
  install-golangci:
    description: Install golangci-lint for Go static analysis
    required: false
    default: "false"
  wails-version:
    description: Wails module version to install
    required: false
    default: v3.0.0-beta.16
  golangci-version:
    description: golangci-lint version
    required: false
    default: v2.13.2
  node-version:
    description: Node.js version
    required: false
    default: "22"
  pnpm-version:
    description: pnpm version
    required: false
    default: "11.1.2"
  task-version:
    description: Task runner version
    required: false
    default: 3.x

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.go-cache == 'true' }}

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Setup Task
      uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      with:
        version: ${{ inputs.task-version }}

    - name: Install frontend dependencies
      if: inputs.install-frontend == 'true'
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Install Wails Linux build dependencies
      if: inputs.install-wails == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev \
          pkg-config \
          gcc \
          libc6-dev

    - name: Install Wails CLI
      if: inputs.install-wails == 'true'
      shell: bash
      env:
        WAILS_VERSION: ${{ inputs.wails-version }}
      run: |
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install golangci-lint
      if: inputs.install-golangci == 'true'
      shell: bash
      env:
        GOLANGCI_VERSION: ${{ inputs.golangci-version }}
      run: |
        go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
