# Nightly desktop/server artifacts as an immutable GitHub pre-release.
# Unique tag per run (nightly-YYYY.MM.DD-SHA). Draft first, then publish, so
# assets attach before immutable release locks the tag.
name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHORT_SHA="${CURRENT_SHA::7}"
          DATE="$(date -u +%Y.%m.%d)"
          VERSION="nightly-${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "Manual nightly run requested"
            exit 0
          fi

          LATEST_TAG="$(gh release list --limit 50 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))] | .[0].tagName // empty')"

          if [ -n "${LATEST_TAG}" ] && [[ "${LATEST_TAG}" == *"-${SHORT_SHA}" ]]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping nightly: no new commits since ${LATEST_TAG}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "Building nightly for ${VERSION}"
          fi

  build:
    name: Build artifacts
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    name: Publish pre-release
    needs:
      - check
      - build
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: Melovian Nightly ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            Automated nightly build from `master`.

            Desktop builds: Linux, Windows, macOS universal.
            Linux AppImage with bundled libmpv.
            Server binaries: Linux, Windows, macOS.
            Android APK and iOS IPA (ad-hoc / unsigned where applicable).

      - name: Publish immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false --prerelease
