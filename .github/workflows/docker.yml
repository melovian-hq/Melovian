# Build and publish the Melovian server image to GHCR.
# Branch/PR builds are path-filtered. Version tags use docker-tags.yml (no path filter).
name: Docker

on:
  workflow_call:
  push:
    branches:
      - master
      - main
    paths:
      - docker/**
      - "*.go"
      - "**/*.go"
      - go.mod
      - go.sum
      - vendor/**
      - frontend/**
      - internal/**
      - services/**
      - cmd/**
      - Taskfile.yml
      - build/Taskfile.yml
      - .github/workflows/docker.yml
      - .github/actions/**
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - docker/**
      - "*.go"
      - "**/*.go"
      - go.mod
      - go.sum
      - vendor/**
      - frontend/**
      - internal/**
      - services/**
      - cmd/**
      - Taskfile.yml
      - build/Taskfile.yml
      - .github/workflows/docker.yml
      - .github/actions/**

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: melovian

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup development environment
        uses: $/.github/actions/setup-dev
        with:
          install-frontend: "true"
          install-wails: "true"

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: OCI build args
        id: oci
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          version="${META_VERSION}"
          if [ -z "${version}" ] || [ "${version}" = "unknown" ]; then
            version="$(git describe --tags --always --dirty 2>/dev/null || echo "${GITHUB_SHA::12}")"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build frontend
        env:
          VERSION: ${{ steps.oci.outputs.version }}
        run: task common:build:frontend

      - name: Ensure Go vendor tree
        run: |
          set -euo pipefail
          if [ ! -d vendor ]; then
            task go:vendor
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.oci.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.oci.outputs.created }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          compression: zstd
          force-compression: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PRs cannot push, so build a single-arch local image for Trivy to
      # scan. Layer cache makes this close to free after the main build.
      - name: Build local image for scanning
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: melovian:scan
          build-args: |
            VERSION=${{ steps.oci.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.oci.outputs.created }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the Fulcio certificate encodes the repo and ref via
      # the workflow OIDC token, so there is no private key to manage.
      # Verify with:
      #   cosign verify ghcr.io/<owner>/melovian \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp 'https://github.com/melovian-hq/Melovian/'
      - name: Sign image (keyless)
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'melovian:scan' || format('{0}@{1}', steps.image.outputs.name, steps.push.outputs.digest) }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Forked PRs get a read-only token without security-events, so only
      # upload SARIF where the permission can exist.
      - name: Upload Trivy results
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Attest image
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
