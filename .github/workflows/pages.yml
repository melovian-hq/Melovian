# Deploys the static frontend demo (dummy catalog, no Go server) to GitHub Pages.
name: Pages demo

on:
  push:
    branches:
      - main
      - master
    paths:
      - frontend/**
      - internal/democatalog/**
      - go.mod
      - go.sum
      - vendor/**
      - Taskfile.yml
      - build/Taskfile.yml
      - .github/workflows/pages.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          install-linux-deps: "false"
          install-nsis: "false"
          install-macos-deps: "false"

      - name: Export demo catalog fixtures
        run: go run ./internal/democatalog/cmd/export -out frontend/public/demo

      - name: Build static demo frontend
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: pnpm run build

      - name: Add SPA fallback for deep links
        # Pages serves 404.html for unknown paths. The router reads
        # window.location.pathname, so copying index.html restores deep links
        # like /Melovian/music.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
