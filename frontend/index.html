<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090909" />
    <title>%VITE_APP_NAME%</title>
    <script>
      (function () {
        var cryptoObj = globalThis.crypto;
        if (!cryptoObj) {
          cryptoObj = {};
          globalThis.crypto = cryptoObj;
        }
        if (typeof cryptoObj.randomUUID === "function") {
          return;
        }
        cryptoObj.randomUUID = function randomUUID() {
          var bytes = new Uint8Array(16);
          if (typeof cryptoObj.getRandomValues === "function") {
            try {
              cryptoObj.getRandomValues(bytes);
            } catch (_) {
              for (var i = 0; i < 16; i++) {
                bytes[i] = (Math.random() * 256) | 0;
              }
            }
          } else {
            for (var j = 0; j < 16; j++) {
              bytes[j] = (Math.random() * 256) | 0;
            }
          }
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;
          var hex = "";
          for (var k = 0; k < 16; k++) {
            hex += ("0" + bytes[k].toString(16)).slice(-2);
          }
          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      })();
    </script>
    <script>
      (function () {
        var STORAGE_KEY = "%VITE_APP_SLUG%-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "dark";
        var resolved =
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        var themeColor = resolved === "dark" ? "#090909" : "#f4f4f5";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", themeColor);
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f4f5;
        color: #18181b;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #090909;
        color: #f5f5f5;
      }
    </style>
    <script>
      (function () {
        var reported = false;
        var currentBootLog = "";

        var btnBaseStyle =
          "border-radius:999px;padding:0.625rem 1rem;cursor:pointer;font:inherit";
        var btnPrimaryStyle =
          "border:1px solid #6366f1;background:#6366f1;color:#fff;" +
          btnBaseStyle;
        var btnSecondaryStyle =
          "border:1px solid #3f3f46;background:transparent;color:#f5f5f5;" +
          btnBaseStyle;

        function fallbackCopyText(text) {
          var textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.select();
          var copied = false;
          try {
            copied = document.execCommand("copy");
          } catch (_) {}
          document.body.removeChild(textarea);
          return copied;
        }

        function copyBootLogs(button) {
          if (!currentBootLog) return;
          var label = button.textContent;
          function markCopied() {
            button.textContent = "Copied";
            setTimeout(function () {
              button.textContent = label;
            }, 1600);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(currentBootLog)
              .then(markCopied)
              .catch(function () {
                if (fallbackCopyText(currentBootLog)) markCopied();
              });
            return;
          }
          if (fallbackCopyText(currentBootLog)) markCopied();
        }

        function closeBootApp() {
          if (typeof window.__melCloseApp === "function") {
            Promise.resolve(window.__melCloseApp()).catch(function () {
              window.close();
            });
            return;
          }
          window.close();
        }

        function render(title, message, detail) {
          if (reported) return;
          reported = true;
          currentBootLog = [title, message, detail]
            .filter(Boolean)
            .join("\n\n");
          var root = document.getElementById("app");
          if (!root) return;
          root.dataset.error = "true";
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:1.5rem;font-family:system-ui,sans-serif">' +
            '<div style="width:min(100%,40rem);padding:1.5rem;border:1px solid #27272a;border-radius:0.75rem;background:#111113">' +
            '<img src="/logo.png" alt="%VITE_APP_NAME%" width="48" height="48" style="display:block;margin:0 0 1rem;border-radius:0.5rem" />' +
            '<p style="margin:0 0 0.5rem;color:#f87171;font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase">Startup error</p>' +
            '<h1 style="margin:0 0 0.75rem;font-size:1.5rem">' +
            title +
            "</h1>" +
            '<p style="margin:0 0 1rem;line-height:1.5;color:#d4d4d8">' +
            message +
            "</p>" +
            '<pre style="margin:0 0 1rem;padding:0.75rem;overflow:auto;border-radius:0.5rem;background:#090909;color:#e4e4e7;font:0.8125rem/1.5 monospace;white-space:pre-wrap;word-break:break-word">' +
            detail +
            "</pre>" +
            '<div style="display:flex;flex-wrap:wrap;gap:0.5rem">' +
            '<button type="button" data-action="reload" style="' +
            btnPrimaryStyle +
            '">Reload app</button>' +
            '<button type="button" data-action="copy" style="' +
            btnSecondaryStyle +
            '">Copy logs</button>' +
            '<button type="button" data-action="close" style="' +
            btnSecondaryStyle +
            '">Close app</button>' +
            "</div></div></div>";

          var reloadButton = root.querySelector('[data-action="reload"]');
          var copyButton = root.querySelector('[data-action="copy"]');
          var closeButton = root.querySelector('[data-action="close"]');
          if (reloadButton) {
            reloadButton.addEventListener("click", function () {
              location.reload();
            });
          }
          if (copyButton) {
            copyButton.addEventListener("click", function () {
              copyBootLogs(copyButton);
            });
          }
          if (closeButton) {
            closeButton.addEventListener("click", function () {
              closeBootApp();
            });
          }
        }

        window.__melMarkMounted = function () {
          var root = document.getElementById("app");
          if (root) root.dataset.mounted = "true";
        };

        function shipBootLog(message, source, stack) {
          try {
            fetch("/api/client-log", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                level: "error",
                message: message,
                source: source || "boot",
                stack: stack || "",
                url: location.href,
                time: new Date().toISOString(),
              }),
              keepalive: true,
            });
          } catch (_) {}
        }

        window.__melReportError = function (error, source) {
          var message =
            error && error.message
              ? error.message
              : typeof error === "string"
                ? error
                : "Unknown error";
          var stack = error && error.stack ? error.stack : "";
          var detail = [
            source ? "Source: " + source : "",
            "URL: " + location.href,
            "Time: " + new Date().toISOString(),
            stack ? "\n" + stack : "",
          ]
            .filter(Boolean)
            .join("\n");
          render("%VITE_APP_NAME% crashed", message, detail);
        };

        window.addEventListener("error", function (event) {
          var root = document.getElementById("app");
          if (root && root.dataset.mounted === "true") return;
          var message =
            event.error && event.error.message
              ? event.error.message
              : event.message || "Unknown error";
          var stack = event.error && event.error.stack ? event.error.stack : "";
          shipBootLog(message, "window.error", stack);
          window.__melReportError(event.error || event.message, "window.error");
        });

        window.addEventListener("unhandledrejection", function (event) {
          var root = document.getElementById("app");
          if (root && root.dataset.mounted === "true") return;
          var reason = event.reason;
          var message =
            reason && reason.message
              ? reason.message
              : typeof reason === "string"
                ? reason
                : "Unhandled promise rejection";
          var stack = reason && reason.stack ? reason.stack : "";
          shipBootLog(message, "unhandledrejection", stack);
          window.__melReportError(reason, "unhandledrejection");
        });

        setTimeout(function () {
          var root = document.getElementById("app");
          if (
            !root ||
            root.dataset.mounted === "true" ||
            root.dataset.error === "true"
          ) {
            return;
          }
          if (root.childElementCount > 0) {
            root.dataset.mounted = "true";
            return;
          }
          window.__melReportError(
            "The app UI did not appear. JavaScript may have failed to load.",
            "startup-watchdog",
          );
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot-error-init.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
