# gitleaks config: vendored and generated trees are skipped.
[extend]
useDefault = true

[allowlist]
description = "Skip vendored and generated trees that trigger generic rules"
paths = [
  '''^vendor/''',
  '''^frontend/node_modules/''',
  '''^frontend/bindings/''',
  '''^build/android/wails-v3/''',
]
